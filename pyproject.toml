[project]
name = "panda"
description = "Patched Attention for Nonlinear Dynamics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11.9"
version = "0.1.0"
dependencies = [
    "hydra-core",
    "numpy",
    "torch",
    "transformers",
    "accelerate",
    "dysts",
    "gluonts[arrow]",
    "scipy",
    "scikit-learn",
    "tqdm",
    "wandb",
    "matplotlib",
    "statsmodels",
    "orjson",
    "tensorboardX",
    "seaborn",
]

[dependency-groups]
dev = [
    "ty",
    "pytest",
    "pytest-randomly",
    "pytest-sugar",
    "ruff",
    "wheel",
    "twine",
    "build",
    "pytest-asyncio>=0.26.0",
    "coverage>=7.8.0",
]
numba = ["numba"]
chronos = ["datasets"] # huggingface datasets
rocm = ["torch==2.2.2"]
profile = ["memory_profiler", "psutil"]

[build-system]
requires = ["setuptools>=76"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["panda", "panda.utils"]

[tool.setuptools_scm]
write_to = "panda/_version.py"

[tool.ruff]
extend-exclude = []
line-length = 120
output-format = "concise"

[tool.ruff.lint]
extend-ignore = [
    "E501", "G004", "ISC001", "PT011", "RET504", "SIM114", "TRY003", "TRY400", "TRY401", "RUF012", "RUF100"
]
extend-select = [
    "I", "E", "W", "UP", "ASYNC", "BLE", "A001", "A002",
    "C4", "DTZ", "T10", "EM", "ISC", "ICN", "G", "PIE", "PT",
    "Q", "SIM", "TID", "TCH", "PLC", "PLE", "TRY", "RUF"
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-errmsg]
max-string-length = 50

[tool.pytest.ini_options]
addopts = "-s --tb=native -v --durations=10"
norecursedirs = ["build", "dist"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["panda"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ty.terminal]
output-format = "concise"

[tool.ty.rules]
missing-argument = "ignore"
unresolved-reference = "ignore"
